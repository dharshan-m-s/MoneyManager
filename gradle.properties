org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# NOTE: the JDK used to run Gradle is intentionally NOT pinned here. A pinned absolute path
# (for example this developer machine's JDK 25, required locally because the host default JDK 27
# emits class-file 71 which Robolectric's ASM cannot instrument) would break CI, where the
# toolchain comes from the runner. Set it per machine in ~/.gradle/gradle.properties:
#   org.gradle.java.home=/path/to/jdk
android.useAndroidX=true
kotlin.code.style=official
