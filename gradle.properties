org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Pin the JDK used to run Gradle/compile. The host default is JDK 27 (class-file 71), which
# Robolectric's ASM cannot instrument, crashing every Room/DB unit test. JDK 25 emits class-file
# 69, which is supported. Override with -Porg.gradle.java.home=... if needed.
org.gradle.java.home=/home/dharshan/.gradle/jdks/eclipse_adoptium-25-amd64-linux.2
android.useAndroidX=true
kotlin.code.style=official
