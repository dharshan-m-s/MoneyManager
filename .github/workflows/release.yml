name: Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version, e.g. 1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'ANDROID_KEYSTORE_BASE64 secret is missing'; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/money-manager-release.jks"
          chmod 600 "$RUNNER_TEMP/money-manager-release.jks"

      - name: Validate release version
        shell: bash
        run: |
          python - <<'PY'
          import os, re, sys
          version = os.environ["VERSION_NAME"].lstrip("v")
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              print(f"Invalid release version: {version}")
              sys.exit(1)
          major, minor, patch = map(int, version.split("."))
          code = major * 1000000 + minor * 1000 + patch
          if code <= 0 or code > 2100000000:
              print(f"Derived VERSION_CODE is out of range: {code}")
              sys.exit(1)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"VERSION_CODE={code}\nVERSION_NAME={version}\n")
          print(f"Publishing Money Manager {version} (versionCode {code})")
          PY

      - name: Build and sign production release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/money-manager-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'ANDROID_KEYSTORE_PASSWORD secret is missing'; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'ANDROID_KEY_ALIAS secret is missing'; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'ANDROID_KEY_PASSWORD secret is missing'; exit 1; }
          gradle test --no-daemon
          gradle :app:assembleRelease --no-daemon

      - name: Prepare release APK
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK" || { echo 'No release APK was produced'; exit 1; }
          cp "$APK" "MoneyManager-v${VERSION_NAME}-release.apk"

      - name: Calculate APK checksum
        shell: bash
        run: sha256sum "MoneyManager-${VERSION_NAME}.apk" > "MoneyManager-${VERSION_NAME}.apk.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME#v}"
          gh release create "$TAG" \
            "MoneyManager-v${VERSION_NAME}-release.apk" \
            "MoneyManager-v${VERSION_NAME}-release.apk.sha256" \
            --title "Money Manager ${VERSION_NAME}" \
            --generate-notes
