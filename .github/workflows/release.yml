name: Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version, e.g. 1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version_name }}
      # Public "owner/repo" identifier baked into the APK so the in-app updater
      # knows which repository's releases to query. Not a secret.
      GITHUB_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'ANDROID_KEYSTORE_BASE64 secret is missing'; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/money-manager-release.jks"
          chmod 600 "$RUNNER_TEMP/money-manager-release.jks"

      - name: Validate release version
        shell: bash
        run: |
          python - <<'PY'
          import os, re, sys
          version = os.environ["VERSION_NAME"].lstrip("v").strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              print(f"Invalid release version: {version}")
              sys.exit(1)
          major, minor, patch = (int(p) for p in version.split("."))
          # The app maps versionCode = major * 1_000_000 + minor * 1_000 + patch.
          # Cap minor/patch so two distinct versions can never share a versionCode.
          if major <= 0 or minor > 999 or patch > 999:
              print(f"Version component out of range (minor/patch must be 0..999): {version}")
              sys.exit(1)
          code = major * 1000000 + minor * 1000 + patch
          if code <= 0 or code > 2100000000:
              print(f"Derived VERSION_CODE is out of range: {code}")
              sys.exit(1)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"VERSION_CODE={code}\nVERSION_NAME={version}\n")
          print(f"Publishing Money Manager {version} (versionCode {code})")
          PY

      - name: Build, test and sign production release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/money-manager-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'ANDROID_KEYSTORE_PASSWORD secret is missing'; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'ANDROID_KEY_ALIAS secret is missing'; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'ANDROID_KEY_PASSWORD secret is missing'; exit 1; }
          gradle test --no-daemon
          gradle :app:assembleRelease --no-daemon

      - name: Prepare release APK
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK" || { echo 'No release APK was produced'; exit 1; }
          cp "$APK" "MoneyManager-${VERSION_NAME}.apk"

      - name: Verify the APK signature is valid
        shell: bash
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          test -d "$BUILD_TOOLS" || BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "MoneyManager-${VERSION_NAME}.apk" || {
            echo 'The release APK is not correctly signed'; exit 1; }

      - name: Verify APK identity and version match the release contract
        shell: bash
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          test -d "$BUILD_TOOLS" || BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          BADGING="$("$BUILD_TOOLS/aapt2" dump badging "MoneyManager-${VERSION_NAME}.apk")"
          echo "$BADGING" | grep -q "package: name='com.moneymanager.app'" || {
            echo 'Unexpected package name in release APK (debug builds use a different id and must never be published)'; exit 1; }
          echo "$BADGING" | grep -q "versionCode='${VERSION_CODE}'" || {
            echo "APK versionCode does not match ${VERSION_CODE}"; exit 1; }
          echo "$BADGING" | grep -q "versionName='${VERSION_NAME}'" || {
            echo "APK versionName does not match ${VERSION_NAME}"; exit 1; }

      - name: Calculate APK checksum
        shell: bash
        run: sha256sum "MoneyManager-${VERSION_NAME}.apk" > "MoneyManager-${VERSION_NAME}.apk.sha256"

      - name: Generate update manifest (update.json)
        shell: bash
        run: |
          SHA="$(awk '{print $1}' "MoneyManager-${VERSION_NAME}.apk.sha256")"
          python - "$VERSION_NAME" "$VERSION_CODE" "$SHA" <<'PY'
          import json, sys
          version_name, version_code, sha256 = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          manifest = {
              "versionName": version_name,
              "versionCode": version_code,
              "tag": f"v{version_name}",
              "apk": f"MoneyManager-{version_name}.apk",
              "sha256": sha256,
              "mandatory": False,
          }
          with open("update.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Validate update manifest against the actual artifacts
        shell: bash
        run: |
          python - "$VERSION_NAME" "$VERSION_CODE" <<'PY'
          import hashlib, json, sys
          version_name, version_code = sys.argv[1], int(sys.argv[2])
          with open("update.json", encoding="utf-8") as fh:
              manifest = json.load(fh)
          expected = {
              "versionName": version_name,
              "versionCode": version_code,
              "tag": f"v{version_name}",
              "apk": f"MoneyManager-{version_name}.apk",
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  print(f"update.json field '{key}' mismatch: {manifest.get(key)!r} != {value!r}")
                  sys.exit(1)
          with open(manifest["apk"], "rb") as fh:
              actual = hashlib.sha256(fh.read()).hexdigest()
          if manifest.get("sha256") != actual:
              print("update.json sha256 does not match the APK")
              sys.exit(1)
          print("update.json is consistent with the release artifacts")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(awk '{print $1}' "MoneyManager-${VERSION_NAME}.apk.sha256")"
          python - "$VERSION_NAME" "$VERSION_CODE" "$SHA" <<'PY'
          import sys
          version_name, version_code, sha256 = sys.argv[1], sys.argv[2], sys.argv[3]
          notes = f"""Money Manager {version_name}

          ## What's changed
          - Production release built and signed by GitHub Actions from tag `v{version_name}`.
          - See the commit history for the detailed changelog.

          ## Update metadata
          - Tag: `v{version_name}`
          - versionCode: {version_code}
          - APK: `MoneyManager-{version_name}.apk`
          - SHA-256: `{sha256}`

          ## Installing
          Open **Settings → App Updates** in the app and tap **Update now**. The app downloads this APK, verifies its checksum and signing identity, then hands it to Android's installer.
          """
          with open("release_notes.md", "w", encoding="utf-8") as fh:
              fh.write("\n".join(line.strip() for line in notes.splitlines()))
          PY
          gh release create "v${VERSION_NAME}" \
            "MoneyManager-${VERSION_NAME}.apk" \
            "MoneyManager-${VERSION_NAME}.apk.sha256" \
            "update.json" \
            --title "Money Manager ${VERSION_NAME}" \
            --notes-file release_notes.md
