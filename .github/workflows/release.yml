name: Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version, e.g. 1.1.10 or v1.1.10'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.version_name || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'ANDROID_KEYSTORE_BASE64 secret is missing'; exit 1; }
          printf %s "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/money-manager-release.jks"
          chmod 600 "$RUNNER_TEMP/money-manager-release.jks"

      - name: Validate release version
        shell: bash
        run: |
          python - <<'PY'
          import os, re, sys
          version = re.sub(r"^v\.?", "", os.environ["VERSION_NAME"].strip())
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              print(f"Invalid release version: {version}")
              sys.exit(1)
          major, minor, patch = map(int, version.split("."))
          # versionCode = major*1_000_000 + minor*1_000 + patch; keep segments < 1000 so
          # 1.1000.0 can never collide with 2.0.0.
          if not (0 <= minor < 1000 and 0 <= patch < 1000):
              print("minor and patch must each be between 0 and 999")
              sys.exit(1)
          code = major * 1000000 + minor * 1000 + patch
          if code <= 0 or code > 2100000000:
              print(f"Derived VERSION_CODE is out of range: {code}")
              sys.exit(1)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"VERSION_CODE={code}\nVERSION_NAME={version}\n")
          print(f"Publishing Money Manager {version} (versionCode {code})")
          PY

      - name: Ensure release tag exists for manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${VERSION_NAME}"
          if EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>/dev/null)"; then
            OBJECT_SHA="$(printf '%s' "$EXISTING" | jq -r '.object.sha // empty')"
            OBJECT_TYPE="$(printf '%s' "$EXISTING" | jq -r '.object.type // empty')"
            if [ -z "$OBJECT_SHA" ]; then
              echo "Could not resolve existing tag ${TAG}; refusing to continue"
              exit 1
            fi
            if [ "$OBJECT_TYPE" = "tag" ]; then
              OBJECT_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${OBJECT_SHA}" --jq '.object.sha')"
            fi
            if [ "$OBJECT_SHA" != "$GITHUB_SHA" ]; then
              echo "Tag ${TAG} already exists on ${OBJECT_SHA}, not ${GITHUB_SHA}"
              exit 1
            fi
            echo "Using existing tag ${TAG}"
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${TAG}" \
              -f "sha=${GITHUB_SHA}" >/dev/null
            echo "Created tag ${TAG} for ${GITHUB_SHA}"
          fi

      - name: Build and sign production release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/money-manager-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'ANDROID_KEYSTORE_PASSWORD secret is missing'; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'ANDROID_KEY_ALIAS secret is missing'; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'ANDROID_KEY_PASSWORD secret is missing'; exit 1; }
          ./gradlew test --no-daemon
          ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare release APK
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK" || { echo 'No release APK was produced'; exit 1; }
          cp "$APK" "MoneyManager-v${VERSION_NAME}-release.apk"

      - name: Verify production signing certificate
        shell: bash
        env:
          EXPECTED_SIGNER_SHA256: d205e23d648bf790d081f4f9df9653392b3dd1b22d4a84a9810533224930a0db
        run: |
          APK="MoneyManager-v${VERSION_NAME}-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER" || { echo 'apksigner not found'; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 30 "$APK" | tee apksigner.txt
          # minSdk 30 supports v3, and AGP 9.3 emits v3 for this signing config. v2 is reported
          # when enabled but is not required on this minimum SDK.
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' apksigner.txt || {
            echo 'Release APK is not signed with APK Signature Scheme v3'
            exit 1
          }
          # apksigner 36 prints "V3.0 Signer: certificate SHA-256 digest"; older versions
          # print "Signer #1 certificate SHA-256 digest". Accept both formats.
          ACTUAL_SIGNER="$(grep -iE '(Signer #[0-9]+|Signer:) certificate SHA-256 digest' apksigner.txt | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z')"
          test "$ACTUAL_SIGNER" = "$EXPECTED_SIGNER_SHA256" || {
            echo "APK was not signed by the official MoneyManager release certificate (actual: ${ACTUAL_SIGNER:-<not found>})"
            exit 1
          }

      - name: Calculate APK checksum
        shell: bash
        run: sha256sum "MoneyManager-v${VERSION_NAME}-release.apk" > "MoneyManager-v${VERSION_NAME}-release.apk.sha256"

      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SIGNER_SHA256: d205e23d648bf790d081f4f9df9653392b3dd1b22d4a84a9810533224930a0db
        shell: bash
        run: |
          TAG="v${VERSION_NAME}"
          APK="MoneyManager-v${VERSION_NAME}-release.apk"
          CHECKSUM="${APK}.sha256"
          VERIFY_DIR="existing-release-assets"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER" || { echo 'apksigner not found'; exit 1; }
          mkdir -p "$VERIFY_DIR"

          # A manual run creates/pushes the tag, which can also start the tag-triggered run.
          # Both paths converge here. An existing release is accepted only after verifying
          # its target commit, checksum, and official signer; assets are never overwritten.
          verify_existing_release() {
            TARGET="$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)"
            if [ "$TARGET" != "$GITHUB_SHA" ]; then
              echo "Existing release ${TAG} targets ${TARGET}, expected ${GITHUB_SHA}"
              return 1
            fi
            gh release download "$TAG" \
              --pattern "$APK" \
              --pattern "$CHECKSUM" \
              --dir "$VERIFY_DIR" \
              --clobber >/dev/null
            (cd "$VERIFY_DIR" && sha256sum -c "$CHECKSUM") || return 1
            "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 30 \
              "$VERIFY_DIR/$APK" > "$VERIFY_DIR/apksigner.txt"
            grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' \
              "$VERIFY_DIR/apksigner.txt" || return 1
            ACTUAL_SIGNER="$(grep -iE '(Signer #[0-9]+|Signer:) certificate SHA-256 digest' "$VERIFY_DIR/apksigner.txt" \
              | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z')"
            test "$ACTUAL_SIGNER" = "$EXPECTED_SIGNER_SHA256" || return 1
            echo "Existing release ${TAG} already has valid signed assets for this commit."
          }

          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              if verify_existing_release; then
                exit 0
              fi
              echo "Existing release ${TAG} is incomplete or invalid; refusing to overwrite it."
              exit 1
            fi
            if gh release create "$TAG" "$APK" "$CHECKSUM" \
                --target "$GITHUB_SHA" \
                --verify-tag \
                --title "Money Manager ${VERSION_NAME}" \
                --generate-notes; then
              exit 0
            fi
            echo "Release creation attempt ${attempt} failed; retrying..."
            sleep $((attempt * 15))
          done
          echo "GitHub release creation failed after 5 attempts"
          exit 1

      - name: Remove signing keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/money-manager-release.jks"
